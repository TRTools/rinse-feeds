name: Build Rinse feeds

on:
  schedule:
    - cron: "17 9 * * *"   # daily, about 5am Toronto time
  workflow_dispatch:         # Run workflow button for manual runs

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet pillow

      - name: Build feeds
        env:
          FEED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: python build_feed.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git diff --cached --quiet && exit 0
          git commit -m "Update feeds"
          # GitHub sometimes answers a push with a server error. Retry a few times.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "Push failed, retry $i in $((i * 15))s"
            sleep $((i * 15))
            git pull --rebase --quiet || true
          done
          exit 1
